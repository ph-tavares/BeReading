name: CI

# BER-34: até aqui nada verificava nada. O type-check do mobile ficou vermelho no
# `main` por 111 commits sem ninguém notar, e o PR #4 foi mergeado assim.
# Este workflow existe para que "verde por omissão" deixe de ser possível.

on:
  pull_request:
  push:
    branches: [main]

# Um PR que recebe push novo cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile — type-check e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # `npm ci` respeita o lockfile; `npm install` não.
      - name: Instalar dependências
        run: npm ci

      # BER-89: `typedRoutes` só verifica string de rota se `.expo/types/router.d.ts`
      # existir, e ele é gitignored. Sem este passo, o `tsc` aceitava qualquer rota.
      # `expo customize tsconfig.json` gera os tipos sem subir o Metro; o `test -s`
      # reprova o job se uma versão futura do Expo deixar de gerar o arquivo, em vez
      # de o type-check voltar a passar verde por omissão.
      - name: Gerar tipos das rotas (typedRoutes)
        run: |
          npx expo customize tsconfig.json
          test -s .expo/types/router.d.ts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Testes
        run: npx jest --ci

  backend:
    name: Edge Functions — type-check e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check das functions
        run: |
          deno check \
            register-reading-session/index.ts \
            evaluate-answer/index.ts \
            award-badges/index.ts \
            generate-questions/index.ts \
            retry-pending-quizzes/index.ts \
            check-chapter-completion/index.ts \
            delete-account/index.ts \
            lookup-book-by-isbn/index.ts \
            get-entitlement/index.ts \
            reading-list/index.ts \
            billing-mock/index.ts \
            ingest-book/index.ts \
            process-ingestion/index.ts \
            scan-page/index.ts \
            _shared/ingestion/supabase-store.ts

      - name: Testes
        run: deno test --allow-net --allow-env

  # BER-50: a pipeline de deploy (deploy.yml) aplica toda migration nova
  # automaticamente depois do merge — sem revisão humana no meio. Esta checagem
  # não impede o merge, mas obriga quem escreve uma migration destrutiva a
  # reconhecer isso de propósito, em vez de deixar passar sem perceber.
  migration-safety:
    name: Migrations — bloqueia operação destrutiva sem reconhecimento
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exigir "-- allow-destructive" em migration com DROP/TRUNCATE/DELETE
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          NEW_FILES=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- supabase/migrations/ || true)
          FAIL=0
          for f in $NEW_FILES; do
            if grep -qiE 'drop[[:space:]]+table|drop[[:space:]]+column|truncate|delete[[:space:]]+from' "$f"; then
              if ! grep -q -- '-- allow-destructive:' "$f"; then
                echo "::error file=${f}::Migration com operação destrutiva (DROP/TRUNCATE/DELETE) sem reconhecimento explícito. Adicione um comentário '-- allow-destructive: <motivo>' no arquivo confirmando que é intencional — o deploy automático (BER-50) aplica isso sem revisão humana."
                FAIL=1
              fi
            fi
          done
          exit $FAIL
