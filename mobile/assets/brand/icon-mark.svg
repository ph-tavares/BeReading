  favicon/adaptive-icon — em 1024px os dois pontos dominavam a composicao e
  liam como fantasma, nao como marcador de pagina. Um icone de app ser versao
  simplificada da marca e' normal, nao inconsistencia (ver Glyph.tsx pro
  personagem completo).

  Tambem afinado ~15% mais estreito que o glyph.svg (largura do desenho 17 de
