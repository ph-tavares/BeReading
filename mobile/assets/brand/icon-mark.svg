  de topo bem arredondado contribuia pra leitura de cabeca mesmo sem os
  olhos. O ponto central do entalhe (x=12) continua no centro do viewBox,
  entao a forma se mantem simetrica.

  Mesmo viewBox 24x32 do glyph.svg de proposito, pra reaproveitar os mesmos
  calculos de margem/zona segura dos HTMLs de geracao (nao versionados, ver
  o relatorio da F3 em .superpowers/sdd/).
