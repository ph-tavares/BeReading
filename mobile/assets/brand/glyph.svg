<!--
  SVG-fonte do marcador (Tarefa 5, BER-77). Mesma forma de src/assistant/Glyph.tsx
  (GLYPH_PATH, GLYPH_VIEWBOX, GLYPH_EYES, GLYPH_EYE_RADIUS) e das cores de
  src/theme/tokens.ts (color.accent, color.accentInk) — copiadas aqui a mao
  porque este arquivo nao roda build step, so serve de fonte pra regerar os
  PNGs de assets/ (icon, splash, favicon, adaptive icon) via Chrome headless.
  Se o desenho do Glyph mudar, atualize aqui tambem e regere os PNGs.

  Proporcao 3:4 (viewBox 24x32). Sem posicionamento nem fundo: quem gera cada
  PNG decide margem, canvas e fundo (ver os HTMLs em assets/brand/*.html
  usados na geracao, ou recrie-os seguindo o mesmo padrao).
-->
